name: pocket-grass
region: nyc
services:
  - name: web
    github:
      repo: surajns0033-collab/pocket-grass
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 4173
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 12
    envs:
      - key: PORT
        value: "4173"
        scope: RUN_AND_BUILD_TIME
      - key: MODEL_ID
        value: onnx-community/gemma-3-270m-it-ONNX
        scope: RUN_TIME
      - key: DIGITALOCEAN_INFERENCE_URL
        value: https://inference.do-ai.run/v1
        scope: RUN_TIME
      - key: DIGITALOCEAN_INFERENCE_MODEL
        value: gemma-4-31B-it
        scope: RUN_TIME
      - key: DIGITALOCEAN_INFERENCE_KEY
        type: SECRET
        scope: RUN_TIME
